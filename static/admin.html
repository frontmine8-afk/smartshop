<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMART SHOP — Admin</title><link rel="icon" href="/static/favicon.svg"><link rel="stylesheet" href="/static/style.css"><style>
.adminwrap{max-width:1250px;margin:30px auto;padding:0 16px}.adminnav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.adminnav button{border:1px solid var(--line)!important;background:var(--surface2)!important;color:var(--text)!important;padding:10px 14px;border-radius:12px}.adminnav button.active{background:linear-gradient(110deg,#7658ed,#29b6c9)!important;color:white!important}.adminpanel{padding:22px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--surface2)}.stat b{font-size:25px;display:block}.admin-table{width:100%;border-collapse:collapse;font-size:13px}.admin-table td,.admin-table th{padding:11px;border-bottom:1px solid var(--line);text-align:left}.admin-table input,.admin-table select{max-width:130px}.login{max-width:420px;margin:10vh auto;padding:28px}.login input{margin:8px 0}.adminform{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px}.adminform textarea{grid-column:1/-1}.adminform button{width:max-content}.muted{color:var(--muted)}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.adminpanel{padding:14px;overflow:auto}.admin-table{min-width:650px}.adminform{grid-template-columns:1fr}.adminform textarea{grid-column:auto}}
</style></head><body><div class="ambient"></div><main class="adminwrap"><header class="top glass"><a class="brand" href="/"><span class="brandmark">S</span><b>SMART SHOP ADMIN</b></a><span style="margin-left:auto"></span><button class="iconbtn" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'dark':'light'">◐</button></header>
<section id="login" class="glass login"><h2>Admin kirish</h2><input id="user" class="field" value="admin" placeholder="Login"><input id="pass" class="field" type="password" placeholder="Parol"><button class="action" onclick="login()">Kirish</button><p class="muted">Birinchi kirish: .env faylidagi ADMIN_USERNAME va ADMIN_PASSWORD.</p><p id="err"></p></section>
