<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SMART SHOP</title><link id="favicon" rel="icon" href="/static/favicon.svg"><link rel="stylesheet" href="/static/style.css"></head>
<body><div class="ambient"></div>
<div id="authGate" class="authgate"><div class="authbox glass"><div class="brand"><span class="brandmark">S</span><b>SMART SHOP</b></div><div id="authContent"></div></div></div>
<header class="top glass"><a class="brand" href="#" onclick="goHome()"><span class="brandmark">S</span><b id="brand">SMART SHOP</b></a><div class="headsearch"><input id="search" placeholder="Mahsulot qidirish..." oninput="render()"><span>⌕</span></div><div class="tools"><select id="lang" onchange="setLang(this.value)"><option value="uz">UZ</option><option value="ru">RU</option><option value="en">EN</option></select><button class="iconbtn" onclick="toggleTheme()" title="Theme">◐</button><button class="iconbtn" onclick="showFavorites()">♡<small id="favCount">0</small></button><button class="iconbtn" onclick="showCart()">▣<small id="cartCount">0</small></button><button class="iconbtn" onclick="showProfile()">♙</button></div></header>
<main><section id="hero" class="hero glass"><div><p class="eyebrow">SMART SHOPPING EXPERIENCE</p><h1 id="heroTitle">Kerakli mahsulotlar.<br><span>Yangi tajriba.</span></h1><p id="heroText">Sevimli mahsulotlaringizni qulay va tez xarid qiling.</p><button class="primary" onclick="document.getElementById('catalog').scrollIntoView({behavior:'smooth'})">Katalogni ko‘rish <b>↗</b></button></div><div class="hero-art"><div class="orb"></div><div class="floatcard glass"><span>✦</span><b>Premium<br>selection</b><small>SMART CHOICE</small></div></div></section>
<div class="sectionhead"><div><p class="eyebrow">DISCOVER</p><h2 id="catalogTitle">Katalog</h2></div><button class="textbtn" onclick="goHome()">Barchasi ↗</button></div>
<div class="layout"><aside class="sidebar glass"><h3 id="categoriesTitle">Kategoriyalar</h3><div id="categories"></div><hr><h3 id="sortTitle">Saralash</h3><select id="sort" onchange="render()"><option value="new">Yangi</option><option value="cheap">Arzon → Qimmat</option><option value="expensive">Qimmat → Arzon</option><option value="discount">Katta chegirma</option></select><label class="check"><input type="checkbox" id="inStock" onchange="render()"> <span id="stockLabel">Faqat mavjud</span></label></aside><section class="catalog" id="catalog"><div class="catalogbar"><span id="resultCount">Mahsulotlar</span><button class="mobilefilter" onclick="document.querySelector('.sidebar').classList.toggle('show')">Filtrlar ☷</button></div><div id="products" class="products"></div></section></div>
<section id="view" class="view glass hidden"></section><footer><b id="footerBrand">SMART SHOP</b><span>© <span id="year"></span> SMART SHOP. All rights reserved.</span></footer></main>
<div id="toast" class="toast"></div><script src="/static/app.js"></script></body></html>
